kernel.split_lock_mitigate = 0
kernel.soft_watchdog = 0
kernel.nmi_watchdog = 0
kernel.watchdog = 0

# Maximum number of file handlers the entire system can open
fs.file-max = 2097152

# Maximum number of inotify watch instances a single user can create
fs.inotify.max_user_instances=8192
# Maximum number of files/directories that can be watched by inotify
fs.inotify.max_user_watches=524288

# Memory
###########
# Set how aggressively the kernel swaps data to ZRAM
vm.swappiness=100
# Set number of pages read/written from swap at once
# 0 is more efficient for ZRAM
vm.page-cluster=0

# Set how aggressively kernel reclaims memory
vm.watermark_boost_factor=0
vm.watermark_scale_factor=125

# Maximum amount of unwritten data allowed in RAM before writing to disk
vm.dirty_bytes=268435456
vm.dirty_background_bytes=134217728

# Increase memory maps (SteamOS default)
vm.max_map_count=2147483642

# The kernel flusher threads will periodically wake up and write old data out to disk.  This
# tunable expresses the interval between those wakeups, in 100'ths of a second (Default is 500).
# Higher value may save battery but will increase risk of data loss in crash scenario
#vm.dirty_writeback_centisecs = 1500
