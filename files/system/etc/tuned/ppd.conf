[main]
# The default PPD profile
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=catcat-powersave
balanced=catcat-balanced
performance=catcat-performance

[battery]
# PPD = TuneD
power-saver=catcat-powersave-battery
balanced=catcat-balanced-battery
