name: build images
on:
  workflow_call:
    inputs:
      image_name:
        required: false
        type: string
        default: catcat-os
      base_image:
        required: false
        type: string
        default: quay.io/fedora-ostree-desktops/silverblue
      alt_tag:
        required: false
        type: string
        default: main

jobs:
  build_image:
    name: ${{ inputs.image_name }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Maximize Build Space
        uses: hastd/free-disk-space@v0.1.2
        with:
          skip-if-available: "80G"

      - name: Mount Container Storage BTRFS Loopback
        shell: bash
        run: |
          sudo truncate -s 70G /mnt/podman-storage.img
          sudo mkfs.btrfs -f /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          sudo mount -o compress-force=zstd:2 /mnt/podman-storage.img /var/lib/containers
          sudo systemctl start podman.service

      - name: Prepare Environment
        id: prep-env
        shell: bash
        run: |
          set -euox pipefail
          lsblk --all -o +FSUSED,FSSIZE,LABEL,FSTYPE
          free -hm
          nproc --all
          pwd
          ls -A1
          printf '#!/bin/bash\nsudo -E "${GITHUB_WORKSPACE}/build/builder" "$@"\n' | \
              install -m 755 -D /dev/stdin "${GITHUB_WORKSPACE}/bin/builder"
          ln -sv "${GITHUB_WORKSPACE}/build/ENVAR" "${GITHUB_WORKSPACE}/bin"/
          echo "${GITHUB_WORKSPACE}/bin" >> "${GITHUB_PATH}"

      - name: Build Image
        id: build-image
        env:
          SBMOK_KEY: ${{ secrets.SBMOK_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          source ENVAR
          builder build \
                  --image-name "${{ inputs.image_name }}" \
                  --base-image "${{ inputs.base_image }}" \
                  --alt-tag    "${{ inputs.alt_tag }}"

      - name: Chunk Image
        id: chunk-image
        env:
          SBMOK_KEY: ${{ secrets.SBMOK_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          source ENVAR
          builder chunk \
                  --image-name "${{ env.image_name }}" \
                  --base-image "${{ inputs.base_image }}" \
                  --alt-tag    "${{ inputs.alt_tag }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GitHub Container Registry
        id: push-image
        env:
          build_tags: ${{ steps.build-image.outputs.build_tags }}
        shell: bash
        run: |
          set -euo pipefail
          source ENVAR
          declare -x BUILD_TAGS="${build_tags}"
          builder push \
                  --image-name "${{ env.image_name }}" \
                  --base-image "${{ inputs.base_image }}" \
                  --alt-tag    "${{ inputs.alt_tag }}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: "v2.6.3"

      - name: Sign Container Image
        env:
          IMAGE_FULL: ${{ env.PUSH_REGISTRY }}/${{ inputs.image_name }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        shell: bash
        run: |
          echo "Image Digest: ${DIGEST}"
          cosign sign -y --key env://COSIGN_PRIVATE_KEY ${IMAGE_FULL}@${DIGEST}
