name: Push To GitHub Container Registry
inputs:
  tags:
    required: true
    type: string

runs:
  using: 'composite'
  steps:
    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      uses: docker/login-action@v4.5.1
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Push To GitHub Container Registry
      if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      id: push-image
      env:
        TAGS: ${{ inputs.tags }}
      shell: bash
      run: |
        set -euo pipefail
        source ${{ github.workspace }}/build/ENVAR
        declare -x BUILD_TAGS="${TAGS}"
        builder() { sudo -E "${{ github.workspace }}/build/build.sh" "$@"; }
        builder push \
                --image-name "${{ matrix.IMAGE_NAME }}" \
                --base-image "${{ matrix.BASE_IMAGE }}" \
                --alt-tag    "${{ matrix.ALT_TAG }}"

