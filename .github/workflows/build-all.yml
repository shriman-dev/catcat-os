name: build all # Build Images, ISOs and make release
# Defines when the workflow will run
on:
  schedule:
    - cron: "0 0 1 * *" # Runs at 00:00 UTC on the 1st of every month
  push:
    branches:
      - main            # Only runs on pushes to main branch
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:    # Allows manual trigger of workflow

# Sets permissions for the workflow
permissions:
  contents: write      # Can modify repository contents
  packages: write      # Can publish packages
  id-token: write      # Can use OIDC tokens

# Prevents concurrent workflow runs
concurrency:
  group: build-all-${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true  # Cancels in-progress runs if a new one is triggered

jobs:
  build-main:
    name: Build Main
    uses: ./.github/workflows/build-image.yaml
    strategy:
      fail-fast: true   # Other builds even if one fails
    secrets: inherit    # Uses secrets from parent workflow

  build-variants:
    name: Build Variants
    needs: [build-main]
    strategy:
      fail-fast: false   # Other builds even if one fails
      matrix:
        include:
          - image_name: catcat-os-nv
            base_image: ghcr.io/shriman-dev/catcat-os
            alt_tag: nvidia
          - image_name: catcat-os-hh
            base_image: ghcr.io/shriman-dev/catcat-os
            alt_tag: deck
    uses: ./.github/workflows/build-image.yaml
    with:
      image_name: ${{ matrix.image_name }}
      base_image: ${{ matrix.base_image }}
      alt_tag: ${{ matrix.alt_tag }}
    secrets: inherit    # Uses secrets from parent workflow

