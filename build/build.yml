services:
  catcat-os:
    build:
      context: ..
      containerfile: Containerfile
      secrets:
        - sbmok_priv
      args:
        PRETTY_NAME: "${PRETTY_NAME}"
        PROJECT_NAME: "${PROJECT_NAME}"
        PROJECT_VENDOR: "${PROJECT_VENDOR}"
        PROJECT_SOURCE: "${PROJECT_SOURCE}"
        PROJECT_README: "${PROJECT_README}"
        PUSH_REGISTRY: "${PUSH_REGISTRY}"
        MAJOR_VERSION: "${MAJOR_VERSION}"
        CUSTOM_KERNEL: "${CUSTOM_KERNEL}"
        TIMEZONE: "${TIMEZONE}"
        DATESTAMP: "${DATESTAMP}"
        TIMESTAMP: "${TIMESTAMP}"
        COMMIT_SHA: "${COMMIT_SHA}"
        IMAGE_NAME: "${IMAGE_NAME}"
        BASE_IMAGE: "${BASE_IMAGE}"
        ALT_TAG: "${ALT_TAG}"
      tags:
        - "${IMAGE_NAME}:${DEFAULT_TAG}"
        - "${IMAGE_NAME}:${MAJOR_VERSION}"
    labels:
      io.artifacthub.package.deprecated: "false"
      io.artifacthub.package.prerelease: "false"
      io.artifacthub.package.readme-url: "${PROJECT_README}"
      org.opencontainers.image.documentation: "${PROJECT_README}"
      org.opencontainers.image.source: "${PROJECT_SOURCE}"
      org.opencontainers.image.created: "${AH_DATE}"
      org.opencontainers.image.description: "${PROJECT_DESCRP}"
      org.opencontainers.image.title: "${IMAGE_NAME}"
      org.opencontainers.image.vendor: "${PROJECT_VENDOR}"
      org.opencontainers.image.version: "${MAJOR_VERSION}.${DATETIMESTAMP}"
      containers.bootc: "1"
secrets:
  sbmok_priv:
    environment: SBMOK_KEY
